<!-- 1. AI Chat Popup Window (Hidden by default) -->
<div
  id="ai-chat-box"
  class="hidden fixed bottom-24 right-6 w-80 sm:w-96 bg-base-100 shadow-2xl rounded-2xl border border-base-300 z-50 flex flex-col overflow-hidden"
>
  <!-- Chat Header -->
  <div
    class="bg-primary text-primary-content p-4 flex justify-between items-center"
  >
    <div class="flex items-center gap-2">
      <span class="font-bold">Event par</span>
      <span class="badge badge-sm badge-secondary">Online</span>
    </div>
    <button onclick="toggleChat()" class="btn btn-sm btn-circle btn-ghost">
      ✕
    </button>
  </div>

  <!-- Chat Messages Area -->
  <div
    id="chat-messages"
    class="p-4 h-72 overflow-y-auto flex flex-col gap-2 bg-base-200"
  >
    <!-- AI Greeting -->
    <div class="chat chat-start">
      <div class="chat-bubble chat-bubble-primary text-sm">
        Hi! Ask me anything.
      </div>
    </div>
  </div>

  <!-- Chat Input Form -->
  <form
    onsubmit="sendMessage(event)"
    class="p-2 bg-base-100 border-t border-base-300 flex gap-2"
  >
    <input
      type="text"
      id="chat-input"
      placeholder="Type your question..."
      class="input input-bordered input-sm flex-1 focus:outline-none"
      required
    />
    <button type="submit" class="btn btn-primary btn-sm">Send</button>
  </form>
</div>

<!-- 2. Single Floating AI Chat Button -->
<button
  onclick="toggleChat()"
  class="btn btn-lg btn-info btn-circle fixed bottom-6 right-6 shadow-lg z-50"
  aria-label="Open AI Chat"
>
  AI
</button>

<!-- 3. JavaScript -->
<script>
  const chatBox = document.getElementById("ai-chat-box");
  const chatMessages = document.getElementById("chat-messages");
  const chatInput = document.getElementById("chat-input");

  function toggleChat() {
    chatBox.classList.toggle("hidden");
    if (!chatBox.classList.contains("hidden")) {
      chatInput.focus();
    }
  }

  function sendMessage(event) {
    event.preventDefault();
    const userText = chatInput.value.trim();
    if (!userText) return;

    appendMessage(userText, "user");
    chatInput.value = "";

    // Replace this timeout with your actual AI API call
    setTimeout(() => {
      appendMessage("Sample AI reply to: " + userText, "ai");
    }, 600);
  }

  function appendMessage(text, sender) {
    const wrapper = document.createElement("div");
    wrapper.className = sender === "user" ? "chat chat-end" : "chat chat-start";

    const bubble = document.createElement("div");
    bubble.className =
      sender === "user"
        ? "chat-bubble text-sm"
        : "chat-bubble chat-bubble-primary text-sm";
    bubble.textContent = text;

    wrapper.appendChild(bubble);
    chatMessages.appendChild(wrapper);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }
</script>
